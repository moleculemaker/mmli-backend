      wraps the HTTP call.
    repository: https://github.com/moleculemaker/chemscraper-helm-chart
    execution: kubernetes-job
    input_schema: chemscraper.input.json
    input_files: One PDF, uploaded before submission. Content is checked for a %PDF header.
    schema_status: verified
    license: null                 # TODO(SME)
    citation: null                # TODO(SME)
    edam:
      operation: null             # TODO(SME)
      topic: null                 # TODO(SME)

