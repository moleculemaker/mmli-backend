# Scientific metadata for each job type.
#
# This file exists so that a person who is not a Kubernetes operator can describe a
# tool. It is deliberately NOT part of the Helm values: the kubernetes_jobs blocks in
# config.yaml are duplicated across config.yaml, local.config.yaml and
# chart/values.yaml, so putting citations there would mean maintaining them in three
# places and editing deployment config to fix a typo in an author list.
#
# Runtime facts (image, command, volumes, resources) stay in config.yaml. This file
# holds only what a human needs to decide whether a tool is the right one to run.
#
# ---------------------------------------------------------------------------------
# FOR SUBJECT-MATTER EXPERTS
#
# Every `null` below marked TODO(SME) is something no one has told us yet. They are
# published as null rather than guessed at, because a wrong citation is worse than an
# absent one. Filling one in is a one-line change to this file.
#
#   license   SPDX identifier for the tool itself, e.g. MIT, BSD-3-Clause, GPL-3.0-only.
#             Not the license of this API.
#   citation  How the tool should be cited. A DOI is ideal.
#   edam      Terms from the EDAM ontology (https://edamontology.org). `operation` is
#             what the tool does; `topic` is the field it belongs to. Full URIs please,
#             e.g. http://edamontology.org/operation_2426
#
# `summary` and `description` were written from the source code and describe mechanics,
# not science. Please correct anything that misrepresents the method.
# ---------------------------------------------------------------------------------
#
# Field reference:
#   summary        one line, shown in listings
#   description    a paragraph; also what an AI agent reads to choose a tool
#   repository     source of the tool itself, not of this API
#   execution      kubernetes-job | parent-job | subjob
#   input_schema   filename in app/schemas/, or null when the tool takes no job_info
#   input_files    what must be uploaded to the job before submission, or null
#   schema_status  verified   - derived from this repository's own parsing code
#                  from-container - derived from the tool container's source or examples
#                  unverified - inferred, needs confirmation
#   internal       true for job types users never submit directly (created by a parent)

tools:

  aceretro:
    name: ACERetro
    summary: Retrosynthesis route planning for a target molecule.
    description: >-
      Plans synthetic routes to a target molecule supplied as SMILES. Input is written
      to the job's input directory as input.json and the container reads it from there.
    repository: null              # TODO(SME)
    execution: kubernetes-job
    input_schema: aceretro.input.json
    input_files: null
    schema_status: unverified
    license: null                 # TODO(SME)
    citation: null                # TODO(SME)
